name: Docker Image CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Log in to ghcr.io with docker
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.repository_owner}}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push docker containers
        uses: docker/build-push-action@v6
        with:
          context: .
          file: envs/PhenotypePCs/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}

      - name: Smoke test merged methylation preparation
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace:ro" \
            -w /workspace \
            -e PREPARE_METHYLATION_SCRIPT=/tmp/PrepareMethylation.R \
            "${{ fromJSON(steps.meta.outputs.json).tags[0] }}" \
            Rscript tests/test_prepare_methylation.R

      - name: Smoke test pre-normalized expression preparation
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace:ro" \
            -w /workspace \
            -e PREPARE_EXPRESSION_SCRIPT=/tmp/PrepareExpression.R \
            "${{ fromJSON(steps.meta.outputs.json).tags[0] }}" \
            Rscript tests/test_prepare_expression_log2_cpm.R
          docker run --rm \
            -v "${{ github.workspace }}:/workspace:ro" \
            -w /workspace \
            -e PREPARE_EXPRESSION_SCRIPT=/tmp/PrepareExpression.R \
            "${{ fromJSON(steps.meta.outputs.json).tags[0] }}" \
            Rscript tests/test_prepare_expression_sample_list.R

  build_cell_type_specific_expression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Log in to ghcr.io with docker
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.repository_owner}}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aou-multiomics-analysis/prepare_qtl-cell-type-specific-expression

      - name: Build and push the cell-type-specific expression image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: envs/CellTypeSpecificExpression/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}

  build_methylation_rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.repository_owner}}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-methylation-rust

      - name: Build and push slim methylation image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: envs/MethylationRust/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
