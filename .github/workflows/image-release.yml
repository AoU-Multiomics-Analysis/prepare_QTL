name: Stage Image Release

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Same-repository PR number (base must be current main)
        required: true
        type: string
      commit_pins:
        description: Commit tested pins (also requires repository enable setting)
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: stage-release-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      head: ${{ steps.plan.outputs.head }}
      base: ${{ steps.plan.outputs.base }}
      matrix: ${{ steps.plan.outputs.matrix }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install miniwdl==1.15.0 PyYAML==6.0.2
      - name: Snapshot source and trusted release policy
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
        run: python ci/release_integration.py snapshot --pr "$PR_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: release-snapshot
          path: release.json

  build:
    needs: snapshot
    if: needs.snapshot.outputs.has_builds == 'true'
    environment: release-publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.snapshot.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.snapshot.outputs.base }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.snapshot.outputs.head }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-snapshot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install miniwdl==1.15.0 PyYAML==6.0.2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build or reuse exact source image
        env:
          IMAGE_ID: ${{ matrix.id }}
        run: python trusted/ci/release_integration.py build --source source --image-id "$IMAGE_ID" --output "$IMAGE_ID.json"
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.id }}
          path: ${{ matrix.id }}.json

  test:
    needs: [snapshot, build]
    if: always() && needs.snapshot.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.snapshot.outputs.base }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.snapshot.outputs.head }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-snapshot
      - uses: actions/download-artifact@v4
        if: needs.snapshot.outputs.has_builds == 'true'
        with:
          pattern: build-*
          path: build-results
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install miniwdl==1.15.0 PyYAML==6.0.2
      - name: Reconstruct candidate pin patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python trusted/ci/release_integration.py prepare --repo trusted --output candidate
      - name: Test exact old and new image combination
        run: |
          if test -s candidate/pins.patch; then
            git -C source apply --check "$GITHUB_WORKSPACE/candidate/pins.patch"
            git -C source apply "$GITHUB_WORKSPACE/candidate/pins.patch"
          fi
          docker swarm init --advertise-addr 127.0.0.1
          python trusted/ci/test_release_images.py --source source --record release.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-test-results
          path: |
            candidate/
            source/ci-runs/

  commit:
    needs: [snapshot, test]
    if: needs.test.result == 'success' && inputs.commit_pins && vars.RELEASE_AUTO_COMMIT == 'true'
    environment: release-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.snapshot.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-snapshot
      - uses: actions/download-artifact@v4
        if: needs.snapshot.outputs.has_builds == 'true'
        with:
          pattern: build-*
          path: build-results
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install miniwdl==1.15.0 PyYAML==6.0.2
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - name: Independently verify and commit only allowed pin defaults
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_AUTO_COMMIT: ${{ vars.RELEASE_AUTO_COMMIT }}
        run: python ci/release_integration.py commit
