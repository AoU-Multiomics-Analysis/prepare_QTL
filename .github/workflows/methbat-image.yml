name: MethBat Image

on:
  pull_request:
    branches: [main]
    paths:
      - tools/methbat/Dockerfile
      - tools/methbat/methbat_prepare_pileups.py
      - tools/methbat/methbat_compare_methods.py
  push:
    branches: [main]
    paths:
      - tools/methbat/Dockerfile
      - tools/methbat/methbat_prepare_pileups.py
      - tools/methbat/methbat_compare_methods.py

permissions:
  contents: read

jobs:
  smoke_methbat_image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      runtime_tree: ${{ steps.runtime.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Identify the MethBat runtime source
        id: runtime
        run: printf 'tree=%s\n' "$(git rev-parse HEAD:tools/methbat)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build the MethBat runtime
        uses: docker/build-push-action@v6
        with:
          context: tools/methbat
          platforms: linux/amd64
          load: true
          tags: methbat-pilot:test
      - name: Run the synthetic workflow task tests
        run: |
          set -euo pipefail
          docker run --rm -e METHBAT_REAL=1 \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work methbat-pilot:test \
            bash -euc '
              python3 -m venv /tmp/smoke
              /tmp/smoke/bin/pip install --disable-pip-version-check miniwdl==1.15.0
              /tmp/smoke/bin/python tests/methylation/test_methbat_chromosome_subsets.py
            '
      - name: Save the tested image for publishing
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          docker save methbat-pilot:test | gzip -1 > "$RUNNER_TEMP/methbat-image.tar.gz"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: methbat-image
          path: ${{ runner.temp }}/methbat-image.tar.gz
          compression-level: 0
          retention-days: 1

  publish_methbat_image:
    if: github.event_name == 'push'
    needs: smoke_methbat_image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: methbat-image
          path: ${{ runner.temp }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the tested image and record its immutable reference
        env:
          RUNTIME_TREE: ${{ needs.smoke_methbat_image.outputs.runtime_tree }}
        run: |
          set -euo pipefail
          docker load -i "$RUNNER_TEMP/methbat-image.tar.gz"
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="$repository:methbat-1.2.0-${GITHUB_SHA}"
          docker tag methbat-pilot:test "$tag"
          docker push "$tag"
          # The WDL can pin this version before GitHub assigns a merge commit SHA.
          runtime_tag="$repository:methbat-1.2.0-rt-$RUNTIME_TREE"
          if ! docker manifest inspect "$runtime_tag" >/dev/null 2>&1; then
            docker tag methbat-pilot:test "$runtime_tag"
            docker push "$runtime_tag"
          fi
          reference=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$tag" | grep -F "$repository@sha256:" | head -n 1)
          printf 'MethBat WDL image input: %s\n' "$reference" >> "$GITHUB_STEP_SUMMARY"
