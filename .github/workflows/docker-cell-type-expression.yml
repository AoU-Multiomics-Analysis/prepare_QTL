name: Cell-Type Expression Image

# Compatibility image builds are manual; staged releases own automatic builds.
on:
  workflow_dispatch:

jobs:
  build_cell_type_specific_expression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Log in to ghcr.io with docker
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.repository_owner}}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aou-multiomics-analysis/prepare_qtl-cell-type-specific-expression

      - name: Build and push the cell-type-specific expression image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: envs/CellTypeSpecificExpression/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
