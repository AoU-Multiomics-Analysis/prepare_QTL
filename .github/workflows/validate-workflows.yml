name: Validate Workflow Descriptors

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate_cell_type_cromwell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Cromwell Womtool 87
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/broadinstitute/cromwell/releases/download/87/womtool-87.jar \
            --output "$RUNNER_TEMP/womtool-87.jar"
          echo "73b63098ac0a87d586b7c5b8729b6e8b440de3df0f5c8b0daafd796dc4ff734c  $RUNNER_TEMP/womtool-87.jar" | sha256sum --check

      - name: Validate cell-type workflows with Cromwell
        env:
          WOMTOOL_JAR: ${{ runner.temp }}/womtool-87.jar
        run: python tests/cell_type_specific_expression/test_cromwell_wdl.py

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install miniwdl
        run: python -m pip install --disable-pip-version-check miniwdl

      - name: Validate Dockstore registration
        run: python scripts/validate_dockstore.py

      - name: Parse Dockstore WDLs
        run: python scripts/validate_dockstore.py | tail -n +2 | xargs -n 1 miniwdl check

      - name: Check WDL and logging contracts
        run: |
          set -euo pipefail
          miniwdl check workflows/cell_type_specific_expression/deconvolution.wdl
          miniwdl check workflows/cell_type_specific_expression/prepare_cell_type_eQTL.wdl
          python tests/cell_type_specific_expression/test_hspe_batch_wdl.py
          python tests/cell_type_specific_expression/test_gene_summary_wdl.py
          python tests/cell_type_specific_expression/test_tca_cleanup_wdl.py
          python tests/cell_type_specific_expression/test_qtl_manifest_wdl.py
          python tests/cell_type_specific_expression/test_reference_filter_wdl.py
          python tests/cell_type_specific_expression/test_terra_file_paths.py
          python tests/test_expression_input_wdl.py
          python scripts/check_wdl_file_scope.py workflows
          python3 scripts/check_wdl_logging.py \
            workflows/cell_type_specific_expression \
            workflows/expression/prepare_eQTL.wdl \
            workflows/common/calculate_phenotypePCs.wdl \
            workflows/common/MergeCovariates.wdl \
            workflows/common/ResidualizePhenotypes.wdl

      - name: Check CI path selection
        run: python tests/test_ci_path_filters.py
