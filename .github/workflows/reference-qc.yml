name: Single-cell reference QC checks

on:
  pull_request:
    branches: [main]
    paths:
      - workflows/cell_type_specific_expression/reference_qc/**
      - tests/reference_qc/**
      - examples/reference_qc/**
      - docs/single-cell-reference-qc.md
      - .github/workflows/reference-qc.yml
  push:
    branches: [main]
    paths:
      - workflows/cell_type_specific_expression/reference_qc/**
      - tests/reference_qc/**
      - examples/reference_qc/**
      - docs/single-cell-reference-qc.md
      - .github/workflows/reference-qc.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source_checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install unit-test dependencies
        # These versions exercise helper logic; this is not the scientific runtime.
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 pandas==2.2.3
      - name: Check snapshots and matrix-selection rules
        run: python tests/reference_qc/run_checks.py
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.1'
      - name: Parse the R scripts without installing analysis packages
        run: |
          Rscript -e 'paths <- list.files("workflows/cell_type_specific_expression/reference_qc", pattern = "[.]R$", recursive = TRUE, full.names = TRUE); stopifnot(length(paths) > 0); invisible(lapply(paths, parse)); message("R source parsing passed")'
