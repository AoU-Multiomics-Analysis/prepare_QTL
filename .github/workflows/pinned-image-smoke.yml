name: Pinned Image Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "tests/release/**"
      - "ci/test_release_images.py"
      - "ci/docker_images.py"
      - "tests/test_docker_image_reuse.py"
      - "ci/image-stages.yml"
      - "tests/test_stage_test_selection.py"
      - ".github/workflows/pinned-image-smoke.yml"
  workflow_dispatch:
    inputs:
      suite:
        description: Cell-type smoke coverage
        type: choice
        options: [full, compact]
        default: full
      all_stages:
        description: Test all registered image families (otherwise cell-type pipeline only)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  pinned_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install WDL runner
        run: python -m pip install miniwdl==1.15.0 PyYAML==6.0.2
      - name: Check stage routing
        run: |
          python tests/test_stage_image_inputs.py
          python tests/test_stage_test_selection.py
          python tests/test_docker_image_reuse.py
      - name: Run with published digest defaults
        env:
          ALL_STAGES: ${{ github.event_name == 'pull_request' || inputs.all_stages }}
          SUITE: ${{ github.event_name == 'pull_request' && 'compact' || inputs.suite }}
        run: |
          docker swarm init --advertise-addr 127.0.0.1
          if test "$ALL_STAGES" = true; then
            python ci/test_release_images.py --source . --all-stages --suite "$SUITE"
          else
            python tests/cell_type_specific_expression/smoke/run_pinned_images.py --suite "$SUITE"
          fi
      - name: Preserve run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-image-smoke-${{ github.run_id }}
          path: ci-runs/
          if-no-files-found: warn
