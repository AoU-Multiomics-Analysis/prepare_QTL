name: RNA-SeQC container checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "tests/rnaseqc2_aggregation/**"
      - ".github/workflows/rnaseqc2-container.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the pinned WDL checker
        run: python -m pip install miniwdl==1.14.2
      - name: Run merger tests
        run: python -m unittest discover -s tests/rnaseqc2_aggregation -v
      - name: Check WDL syntax and types
        run: miniwdl check workflows/expression/rnaseqc2_aggregate_batched.wdl
      - name: Check command logging
        run: python scripts/check_wdl_logging.py workflows/expression/rnaseqc2_aggregate_batched.wdl

  container:
    runs-on: ubuntu-22.04
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the pinned WDL runner
        run: python -m pip install miniwdl==1.14.2
      - uses: docker/setup-buildx-action@v3
      - name: Build the candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: envs/RNASeQCAggregation/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: rnaseqc2-aggregation:test
          cache-from: type=gha,scope=rnaseqc2-aggregation
          cache-to: type=gha,mode=max,scope=rnaseqc2-aggregation
      - name: Start the local WDL container backend
        run: docker swarm init --advertise-addr 127.0.0.1
      - name: Test the bundled script and WDL tasks
        run: python tests/rnaseqc2_aggregation/smoke_container.py --image rnaseqc2-aggregation:test
      - name: Record resolved package versions
        run: docker run --rm rnaseqc2-aggregation:test micromamba list --name base --explicit > rnaseqc2-linux-64.explicit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rnaseqc2-container-packages
          path: rnaseqc2-linux-64.explicit.txt
