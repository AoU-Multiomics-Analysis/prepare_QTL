name: RNA-SeQC aggregation checks

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "envs/RNASeQCAggregation/**"
      - "scripts/check_wdl_logging.py"
      - "scripts/expression/merge_rnaseqc.py"
      - "workflows/expression/rnaseqc2_aggregate_batched.wdl"
      - "workflows/expression/examples/rnaseqc2_aggregation/**"
      - "tests/rnaseqc2_aggregation/**"
      - "docs/rnaseqc2-aggregation.md"
      - ".github/workflows/rnaseqc2-aggregation.yml"
  push:
    branches: [main, "codex/**"]
    paths:
      - "envs/RNASeQCAggregation/**"
      - "scripts/check_wdl_logging.py"
      - "scripts/expression/merge_rnaseqc.py"
      - "workflows/expression/rnaseqc2_aggregate_batched.wdl"
      - "workflows/expression/examples/rnaseqc2_aggregation/**"
      - "tests/rnaseqc2_aggregation/**"
      - "docs/rnaseqc2-aggregation.md"
      - ".github/workflows/rnaseqc2-aggregation.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the pinned WDL checker
        run: python -m pip install miniwdl==1.14.2
      - name: Run merger tests
        run: python -m unittest discover -s tests/rnaseqc2_aggregation -v
      - name: Check WDL syntax and types
        run: miniwdl check workflows/expression/rnaseqc2_aggregate_batched.wdl
      - name: Check command logging
        run: python scripts/check_wdl_logging.py workflows/expression/rnaseqc2_aggregate_batched.wdl

  container:
    runs-on: ubuntu-22.04
    needs: test
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/aou-multiomics-analysis/prepare_qtl-rnaseqc2-aggregation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the pinned WDL runner
        run: python -m pip install miniwdl==1.14.2
      - uses: docker/setup-buildx-action@v3
      - name: Build the candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: envs/RNASeQCAggregation/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: rnaseqc2-aggregation:test
          cache-from: type=gha,scope=rnaseqc2-aggregation
          cache-to: type=gha,mode=max,scope=rnaseqc2-aggregation
      - name: Start the local WDL container backend
        run: docker swarm init --advertise-addr 127.0.0.1
      - name: Test the bundled script and WDL tasks
        run: python tests/rnaseqc2_aggregation/smoke_container.py --image rnaseqc2-aggregation:test
      - name: Record resolved package versions
        run: docker run --rm rnaseqc2-aggregation:test micromamba list --name base --explicit > rnaseqc2-linux-64.explicit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rnaseqc2-container-packages
          path: rnaseqc2-linux-64.explicit.txt
      # Never publish code from a pull_request event. A trusted push builds and
      # tests the exact image before this job receives registry credentials.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.repository == 'AoU-Multiomics-Analysis/prepare_QTL'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: github.event_name == 'push' && github.repository == 'AoU-Multiomics-Analysis/prepare_QTL'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker tag rnaseqc2-aggregation:test "$IMAGE:sha-$SOURCE_SHA"
          docker push "$IMAGE:sha-$SOURCE_SHA"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            docker tag rnaseqc2-aggregation:test "$IMAGE:main"
            docker push "$IMAGE:main"
          fi
          docker image inspect "$IMAGE:sha-$SOURCE_SHA" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
