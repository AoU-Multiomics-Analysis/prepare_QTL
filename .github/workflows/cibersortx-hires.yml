name: CIBERSORTx HiRes checks

on:
  pull_request:
    branches: [main]
    paths:
      - workflows/cell_type_specific_expression/cibersortx_hires.wdl
      - tests/cibersortx_hires/**
      - scripts/check_wdl_file_scope.py
      - scripts/check_wdl_logging.py
      - examples/cibersortx_hires/**
      - .github/workflows/cibersortx-hires.yml
  push:
    branches: [main]
    paths:
      - workflows/cell_type_specific_expression/cibersortx_hires.wdl
      - tests/cibersortx_hires/**
      - scripts/check_wdl_file_scope.py
      - scripts/check_wdl_logging.py
      - examples/cibersortx_hires/**
      - .github/workflows/cibersortx-hires.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_and_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the WDL reader
        run: python -m pip install --disable-pip-version-check miniwdl==1.15.0
      - name: Check WDL and file localization
        run: |
          set -euo pipefail
          miniwdl check workflows/cell_type_specific_expression/cibersortx_hires.wdl
          python scripts/check_wdl_file_scope.py workflows/cell_type_specific_expression/cibersortx_hires.wdl
          python scripts/check_wdl_logging.py workflows/cell_type_specific_expression/cibersortx_hires.wdl
          python -m unittest discover -s tests/cibersortx_hires -v
      - name: Test commands in the pinned image with synthetic calculations
        run: |
          set -euo pipefail
          CIBERSORTX_TEST_IMAGE=$(python - <<'PY'
          import WDL
          task = next(task for task in WDL.load('workflows/cell_type_specific_expression/cibersortx_hires.wdl').tasks if task.name == 'RunHiRes')
          print(task.runtime['docker'].eval(WDL.Env.Bindings(), WDL.StdLib.Base('1.0')).value)
          PY
          )
          export CIBERSORTX_TEST_IMAGE
          docker pull "$CIBERSORTX_TEST_IMAGE"
          # The fixture replaces only the authenticated native calculation.
          # No credentials, image build, or CIBERSORTx analysis is required.
          python -m unittest discover -s tests/cibersortx_hires -v 2>&1 | tee "$RUNNER_TEMP/cibersortx-hires-smoke.log"
      - name: Save smoke-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cibersortx-hires-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/cibersortx-hires-smoke.log
          if-no-files-found: warn
