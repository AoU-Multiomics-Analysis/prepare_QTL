name: Cell-Type-Specific Expression CI

# Source changes use Stage Image Release. Keep candidate test changes testable.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "tests/cell_type_specific_expression/*.R"
      - "tests/cell_type_specific_expression/testthat/**"
      - "tests/cell_type_specific_expression/smoke/**"
      - "tests/cell_type_specific_expression/fixtures/**"
      - "tests/test_prepare_expression_log2_cpm.R"
      - "tests/test_prepare_expression_sample_list.R"
      - "tests/test_reference_filtered_expression.R"
      - "tests/test_prepare_methylation.R"
      - ".github/workflows/cell-type-specific-expression-ci.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select full workflow tests
        id: integration
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif ! changed=$(git diff --name-only "$BASE...$HEAD" -- \
            tests/cell_type_specific_expression/smoke \
            tests/cell_type_specific_expression/fixtures \
            tests/cell_type_specific_expression/generate_reference_fixture.R); then
            # Run the tests if the PR comparison is unavailable.
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif [[ -n "$changed" ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the descriptor reader
        run: python -m pip install --disable-pip-version-check miniwdl==1.15.0 PyYAML==6.0.2

      - name: Read pinned dependency images
        id: images
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'ci')
          from propose_image_pins import literal_span, validate_image
          text = Path('workflows/cell_type_specific_expression/prepare_cell_type_eQTL.wdl').read_text()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, name, repository in (
                  ('cell', 'fit_docker_image', 'ghcr.io/aou-multiomics-analysis/prepare_qtl-cell-type-specific-expression'),
                  ('standard', 'qtl_docker_image', 'ghcr.io/aou-multiomics-analysis/prepare_qtl'),
              ):
                  value = literal_span(text, name)[2]
                  validate_image(value, repository)
                  output.write(f'{key}={value}\n')
          PY
      - name: Pull pinned dependency images
        env:
          CELL_IMAGE: ${{ steps.images.outputs.cell }}
          STANDARD_IMAGE: ${{ steps.images.outputs.standard }}
        run: |
          set -euo pipefail
          docker pull "$CELL_IMAGE"
          docker pull "$STANDARD_IMAGE"

      - name: Run the cell-type-specific R suite
        env:
          CELL_IMAGE: ${{ steps.images.outputs.cell }}
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$CELL_IMAGE" \
            Rscript scripts/cell_type_specific_expression/lint_r.R
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$CELL_IMAGE" \
            Rscript tests/cell_type_specific_expression/testthat.R

      - name: Test pre-normalized expression in the standard image
        env:
          STANDARD_IMAGE: ${{ steps.images.outputs.standard }}
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            --env PREPARE_EXPRESSION_SCRIPT=/workspace/scripts/expression/PrepareExpression.R \
            "$STANDARD_IMAGE" \
            Rscript tests/test_prepare_expression_log2_cpm.R
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            --env PREPARE_EXPRESSION_SCRIPT=/workspace/scripts/expression/PrepareExpression.R \
            "$STANDARD_IMAGE" \
            Rscript tests/test_prepare_expression_sample_list.R
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            --env PREPARE_EXPRESSION_SCRIPT=/workspace/scripts/expression/PrepareExpression.R \
            "$STANDARD_IMAGE" \
            Rscript tests/test_reference_filtered_expression.R

      - name: Test methylation preparation in the standard image
        env:
          STANDARD_IMAGE: ${{ steps.images.outputs.standard }}
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" --workdir /workspace \
            --env PREPARE_METHYLATION_SCRIPT=/workspace/scripts/methylation/PrepareMethylation.R \
            "$STANDARD_IMAGE" Rscript tests/test_prepare_methylation.R

      - name: Run full workflows and saved-model restart with pinned images
        if: steps.integration.outputs.run == 'true'
        run: |
          set -euo pipefail
          docker swarm init --advertise-addr 127.0.0.1
          python tests/cell_type_specific_expression/smoke/run_pinned_images.py

      - name: Upload failure logs, manifests, and QC files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cell-type-specific-expression-failure-${{ github.run_id }}
          path: |
            ci-runs/**/*.log
            ci-runs/**/stdout.txt
            ci-runs/**/stderr.txt
            ci-runs/**/error.json
            ci-runs/**/outputs.json
            ci-runs/**/*manifest*.json
            ci-runs/**/*manifest*.tsv
            ci-runs/**/*inventory*.tsv
            ci-runs/**/qc*.tsv
            ci-runs/**/qc*.pdf
            ci-runs/**/*outliers*.tsv
            ci-runs/**/*filter*.tsv
            ci-runs/**/gene_comparison.tsv.gz
            ci-runs/**/negative_summary.tsv.gz
            ci-runs/**/*.bed.gz
            ci-runs/**/reference_metadata.json
            ci-runs/**/plots/*.pdf
          if-no-files-found: warn
